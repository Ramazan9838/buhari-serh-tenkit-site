<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Buhârî Şerh Literatüründe Tenkit</title>
<style>
/* Giriş sayfası: sitenin şifreli kopyasını açar ve ortak kaydı eşitler. Şifre çözme yalnız tarayıcıda yapılır. */
:root {
  color-scheme: light;
  --bg: #f3f2ee; --paper: #fcfcfb; --ink: #1c2422; --ink-2: #4f5754; --line: #cfccc3;
  --accent: #1f5c4b; --accent-2: #2a7a64; --bad: #b3261e; --ok: #0f7a3a; --warn: #8a5a00; --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 10px 30px rgba(20,30,25,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121412; --paper: #1a1a19; --ink: #eceee9; --ink-2: #c3c2b7; --line: #3d403b;
    --accent: #6cc2a3; --accent-2: #86d4b7; --bad: #ff8a80; --ok: #5fd08a; --warn: #f0c060; --focus: #6da7ec;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
#giris { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.kart { width: 100%; max-width: 380px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 28px 24px; }
h1 { font-size: 19px; margin: 0 0 4px; line-height: 1.3; }
.alt { color: var(--ink-2); font-size: 13.5px; margin: 0 0 22px; }
label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button { color: #10201a; } }
button:hover { background: var(--accent-2); }
button:disabled { opacity: .6; cursor: progress; }
button.ikincil { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.kart > button { width: 100%; margin-top: 20px; padding: 11px 12px; }
#durum { min-height: 22px; margin: 14px 0 0; font-size: 13.5px; color: var(--ink-2); }
#durum.hata { color: var(--bad); }
.not { margin: 18px 0 0; font-size: 12px; color: var(--ink-2); }
#site { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #fff; }
#paketDurum { position: fixed; right: 16px; bottom: 16px; z-index: 10; display: none; max-width: calc(100% - 32px);
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 14px; font-size: 13px; }
/* ortak kayıt göstergesi ve paneli */
#ortakDugme { position: fixed; left: 12px; bottom: 12px; z-index: 11; display: none; align-items: center; gap: 7px; max-width: calc(100% - 24px);
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
  padding: 5px 11px 5px 9px; font-size: 12px; font-weight: 600; }
#ortakDugme:hover { background: var(--paper); border-color: var(--accent); }
#ortakDugme i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); flex: none; }
#ortakDugme.ok i { background: var(--ok); } #ortakDugme.is i { background: var(--focus); }
#ortakDugme.uyari i { background: var(--warn); } #ortakDugme.hata i { background: var(--bad); }
#ortakDugme span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ortakPanel { position: fixed; left: 12px; bottom: 52px; z-index: 12; display: none; width: 400px; max-width: calc(100% - 24px); max-height: calc(100% - 70px); overflow: auto;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; font-size: 13.5px; }
#ortakPanel h2 { font-size: 15px; margin: 0 0 6px; }
#ortakPanel p, #ortakPanel ol { margin: 8px 0; color: var(--ink-2); }
#ortakPanel ol { padding-left: 20px; } #ortakPanel li { margin: 3px 0; }
#ortakPanel code { font-size: 12px; }
#ortakPanel a { color: var(--accent); }
#ortakPanel .satir { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#ortakPanel .bilgi { color: var(--ink); }
#ortakPanel .hata { color: var(--bad); }
#ortakPanel input { padding: 8px 10px; font-size: 13px; }
</style>
</head>
<body>
<main id="giris">
  <form class="kart" id="form" autocomplete="on">
    <h1>Buhârî Şerh Literatüründe Tenkit</h1>
    <p class="alt">Araştırma sistemi · yalnız yetkili giriş</p>
    <label for="kullanici">Kullanıcı adı</label>
    <input id="kullanici" name="username" autocomplete="username" value="Admin" required>
    <label for="sifre">Şifre</label>
    <input id="sifre" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="gir" type="submit">Giriş</button>
    <p id="durum" role="status" aria-live="polite"></p>
    <p class="not">Sayfanın içeriği şifrelidir; şifre çözme bu tarayıcıda yapılır, şifre hiçbir yere gönderilmez.</p>
  </form>
</main>
<iframe id="site" title="Araştırma sistemi"></iframe>
<div id="paketDurum" role="status" aria-live="polite"></div>
<button id="ortakDugme" type="button" aria-expanded="false" aria-controls="ortakPanel"><i></i><span>Ortak kayıt</span></button>
<section id="ortakPanel" aria-label="Ortak kayıt"></section>
<script src="ortak.js"></script>
<script>
(function () {
  'use strict';
  var OTURUM = 'bst.oturum', OTURUM_AD = 'bst.kullanici', YEREL_BAG = 'bst.ortak.baglanti';
  var KEY = 'buhariTenkitResearchSystem.v1', PFLAG = 'buhari.v34.idbAhead', SITE_DB = 'buhari_v34_safety';
  var VARSAYILAN = { depo: 'Ramazan9838/buhari-serh-tenkit-repo', dal: 'ortak-kayit', yayin: 'Ramazan9838/buhari-serh-tenkit-site' };
  var enc = new TextEncoder(), dec = new TextDecoder();
  var kasa = null, anahtar = null, paketIs = null, kullanici = 'Admin';
  var $ = function (id) { return document.getElementById(id); };

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64Yap(u) { var s = ''; for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
  function durum(t, hata) { var d = $('durum'); d.textContent = t || ''; d.className = hata ? 'hata' : ''; }
  function kacis(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function kasaGetir() {
    return fetch('kasa.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('kasa.json okunamadı (' + r.status + ')');
      return r.json();
    }).then(function (k) { kasa = k; return k; });
  }

  // Şifreden anahtar türetilir (PBKDF2-SHA256), yuvadaki veri anahtarı onunla açılır (AES-GCM).
  function yuvaAc(ad, sifre) {
    var aranan = ad.trim().toLocaleLowerCase('tr');
    var y = kasa.yuvalar.filter(function (x) { return x.kullanici.toLocaleLowerCase('tr') === aranan; })[0];
    if (!y) return Promise.reject(new Error('giris'));
    return crypto.subtle.importKey('raw', enc.encode(sifre), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(y.salt), iterations: y.iter },
        k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (kek) {
      var w = b64(y.w);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: w.slice(0, 12), additionalData: enc.encode('bst-yuva:' + y.kullanici) }, kek, w.slice(12));
    }).then(function (ham) { kullanici = y.kullanici; return ham; }).catch(function () { throw new Error('giris'); });
  }

  function anahtarKur(ham) {
    return crypto.subtle.importKey('raw', ham, 'AES-GCM', false, ['encrypt', 'decrypt']).then(function (k) { anahtar = k; return k; });
  }
  function muhurle(nesne, ek) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: enc.encode(ek) }, anahtar, enc.encode(JSON.stringify(nesne))).then(function (c) {
      var u = new Uint8Array(12 + c.byteLength); u.set(iv); u.set(new Uint8Array(c), 12); return b64Yap(u);
    });
  }
  function muhurAc(metin, ek) {
    var u = b64(metin);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12), additionalData: enc.encode(ek) }, anahtar, u.slice(12)).then(function (a) { return JSON.parse(dec.decode(a)); });
  }

  // Bir dosyanın şifreli parçaları indirilir, çözülür, birleştirilir ve gzip açılır.
  function dosyaAc(ad, ilerleme) {
    var d = kasa.dosyalar[ad], parcalar = [], bitti = 0;
    return Promise.all(d.parcalar.map(function (yol, i) {
      return fetch(yol).then(function (r) {
        if (!r.ok) throw new Error(yol + ' indirilemedi (' + r.status + ')');
        return r.arrayBuffer();
      }).then(function (buf) {
        var u = new Uint8Array(buf);
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12), additionalData: enc.encode('bst-parca:' + ad + ':' + i) }, anahtar, u.slice(12));
      }).then(function (acik) {
        parcalar[i] = acik; bitti++;
        if (ilerleme) ilerleme(bitti, d.parcalar.length);
      });
    })).then(function () {
      var akis = new Blob(parcalar).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(akis).text();
    });
  }

  function paketDurum(t) { var p = $('paketDurum'); p.textContent = t || ''; p.style.display = t ? 'block' : 'none'; }

  // Site kaynak paketini istediğinde (bkz. yayinla.py'deki spLoadScript yaması) çağrılır.
  window.__bstPaket = function (hedef) {
    if (!paketIs) {
      paketDurum('Kaynak paketi indiriliyor…');
      paketIs = dosyaAc('paket', function (n, t) { paketDurum('Kaynak paketi indiriliyor… ' + n + '/' + t); }).then(function (metin) {
        paketDurum('Kaynak paketi açılıyor…');
        return JSON.parse(metin.slice(metin.indexOf('{'), metin.lastIndexOf('}') + 1));
      });
      paketIs.then(function () { paketDurum(''); }, function (e) {
        paketDurum('Kaynak paketi açılamadı: ' + (e && e.message || e)); paketIs = null;
      });
    }
    return paketIs.then(function (P) {
      hedef.__v34SrcPack = Object.assign(hedef.__v34SrcPack || {}, P);
      return true;
    }, function () { return false; });
  };

  /* =========================================================
     Ortak kayıt: çalışma verisi (sitenin tarayıcı deposundaki ana kaydı) özel depodaki
     ortak-kayit dalıyla eşitlenir. Birleştirme ve GitHub istemcisi ortak.js'tedir.
     ========================================================= */
  var O = window.BstOrtak, bag = null, depo = null, calisiyor = false, zamanlayici = 0, sonEtkinlik = 0;
  var ortak = { durum: 'kapali', ileti: 'Ortak kayıt kapalı', sonAt: '', commit: '', cakisma: 0, hata: '' };

  // --- IndexedDB yardımcıları (sitenin deposu ve ortak kaydın kendi deposu) ---
  function idb(ad, surum, kur) {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(ad, surum);
      r.onupgradeneeded = function () { kur(r.result); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function siteDb() {
    return idb(SITE_DB, 2, function (d) {
      ['snaps', 'kv', 'src'].forEach(function (s, i) { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: i === 1 ? 'k' : 'id' }); });
    });
  }
  function ortakDb() { return idb('bst-ortak', 1, function (d) { if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); }); }
  function islem(dbp, depoAd, kip, fn) {
    return dbp.then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(depoAd, kip), out = fn(t.objectStore(depoAd));
        t.oncomplete = function () { d.close(); res(out && 'result' in out ? out.result : undefined); };
        t.onerror = t.onabort = function () { d.close(); rej(t.error); };
      });
    });
  }
  function ortakAl(k) { return islem(ortakDb(), 'kv', 'readonly', function (s) { return s.get(k); }); }
  function ortakKoy(k, v) { return islem(ortakDb(), 'kv', 'readwrite', function (s) { return v === undefined ? s.delete(k) : s.put(v, k); }); }

  // --- sitenin ana kaydını okuma/yazma (site kendi açılışında buradan yükler) ---
  function yerelOku() {
    var t = null, ileri = false;
    try { ileri = localStorage.getItem(PFLAG) === '1'; if (!ileri) t = localStorage.getItem(KEY); } catch (e) {}
    if (t) return Promise.resolve(t);
    return islem(siteDb(), 'kv', 'readonly', function (s) { return s.get('primary'); }).then(function (r) { return r && r.v && r.v.text || null; }, function () { return null; }).then(function (m) {
      // Site açık ama henüz hiç kaydetmediyse bir kez kaydettirilir.
      var w = m ? null : siteGeceri();
      if (!w || w.__v34.boot || w.__v34.frozen) return m;
      try { w.persistState(); t = localStorage.getItem(KEY); } catch (e) {}
      return t || m;
    });
  }
  function yerelYaz(metin, fisSayisi) {
    var ls = true;
    try { localStorage.setItem(KEY, metin); localStorage.setItem(PFLAG, '0'); } catch (e) { ls = false; }
    var satir = { k: 'primary', v: { at: new Date().toISOString(), text: metin, records: fisSayisi, site: kasa.surum } };
    return islem(siteDb(), 'kv', 'readwrite', function (s) { return s.put(satir); }).then(function () {
      try {
        if (!ls) { localStorage.setItem(PFLAG, '1'); localStorage.removeItem(KEY); }
        sessionStorage.removeItem('buhari.v34.primText'); sessionStorage.removeItem('buhari.v34.primAt');
      } catch (e) {}
    });
  }

  // --- bağlantı ayarı: kasa.json'da veri anahtarıyla mühürlü; yoksa bu tarayıcıdaki kopya ---
  function bagYukle() {
    var kaynak = kasa.ortak ? muhurAc(kasa.ortak, 'bst-ortak') : Promise.reject();
    return kaynak.catch(function () {
      var y = null; try { y = localStorage.getItem(YEREL_BAG); } catch (e) {}
      return y ? muhurAc(y, 'bst-ortak') : null;
    }).catch(function () { return null; }).then(function (b) { bagKur(b); return b; });
  }
  function bagKur(b) {
    bag = b && b.token ? Object.assign({}, VARSAYILAN, b) : null;
    depo = bag ? new O.Depo({ token: bag.token, sahip: bag.depo.split('/')[0], ad: bag.depo.split('/')[1], dal: bag.dal }) : null;
    if (!bag) gosterge('kapali', 'Ortak kayıt kapalı');
  }

  function gosterge(d, ileti) { ortak.durum = d; ortak.ileti = ileti; ciz(); }
  function saat(t) { try { return new Date(t).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }

  function siteGeceri() { var f = $('site'); try { return f.style.display === 'block' && f.contentWindow && f.contentWindow.__v34 ? f.contentWindow : null; } catch (e) { return null; } }
  function bosta() {
    var w = siteGeceri(); if (!w) return true;
    try {
      var a = w.document.activeElement, t = a && a.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || (a && a.isContentEditable)) return false;
      if (w.__v34.boot) return false;
    } catch (e) {}
    return Date.now() - sonEtkinlik > 4000;
  }

  function zamanla(ms) { clearTimeout(zamanlayici); zamanlayici = setTimeout(esitle, ms); }

  // Bir eşitleme turu. baslangic: site henüz açılmadı (yerel yazım için dondurma ve yeniden yükleme gerekmez).
  function esitle(baslangic) {
    if (!bag || !O) return Promise.resolve();
    if (calisiyor) { zamanla(3000); return Promise.resolve(); }
    calisiyor = true; clearTimeout(zamanlayici);
    gosterge('is', 'Eşitleniyor…');
    var t0 = null, taban = null, tekrar = 0;
    var tur = function () {
      return Promise.all([yerelOku(), ortakAl('taban')]).then(function (x) {
        t0 = x[0]; taban = x[1] && x[1].depo === bag.depo + '#' + bag.dal ? x[1].okuma : null;
        return O.esitle({
          depo: depo, taban: taban, yerel: t0 ? JSON.parse(t0) : null, kullanici: kullanici,
          izin: function (yerelDegisecek) { return baslangic === true || !yerelDegisecek || bosta(); }
        });
      }).catch(function (e) {
        if (e && e.cakisma && tekrar++ < 3) return tur();
        throw e;
      });
    };
    return tur().then(function (s) {
      if (s.ertelendi) { gosterge('uyari', 'Başka bilgisayardan değişiklik var · siz yazmayı bitirince uygulanacak'); zamanla(5000); return; }
      var bitir = function () {
        return ortakKoy('taban', s.okuma ? { depo: bag.depo + '#' + bag.dal, okuma: s.okuma } : undefined).then(function () {
          ortak.sonAt = new Date().toISOString(); ortak.commit = s.okuma ? s.okuma.commit : ''; ortak.cakisma = s.cakisma; ortak.hata = '';
          gosterge('ok', s.okuma ? 'Ortak kayıt · eşitlendi ' + saat(ortak.sonAt) : 'Ortak kayıt · bu tarayıcıda henüz veri yok');
        });
      };
      if (!s.yerelDegisti) return bitir();
      var metin = JSON.stringify(s.durum), fisSayisi = (s.durum.recordOrder || []).length;
      var onceki = !taban && t0 ? ortakKoy('onceki', { at: new Date().toISOString(), text: t0 }) : Promise.resolve();
      return onceki.then(yerelOku).then(function (t1) {
        if (t1 !== t0) { zamanla(2000); return; }   // eşitleme sürerken burada kayıt yapıldı: taban ilerletilmez, yeniden denenir
        var w = baslangic === true ? null : siteGeceri();
        if (w) { try { w.__v34.frozen = true; w.clearTimeout(w.__v34.timer); } catch (e) {} }
        return yerelYaz(metin, fisSayisi).then(bitir).then(function () {
          if (w) {
            ortak.ileti = 'Başka bilgisayardan gelen değişiklikler uygulandı'; ciz();
            w.location.reload();
          }
        });
      });
    }).catch(function (e) {
      ortak.hata = e && e.message || String(e);
      var cevrimdisi = !navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test(ortak.hata);
      gosterge(e && e.durum === 401 ? 'hata' : 'uyari', e && e.durum === 401 ? 'Ortak kayıt · erişim anahtarı geçersiz' :
        cevrimdisi ? 'Ortak kayıt · çevrim dışı (değişiklikler bu tarayıcıda bekliyor)' : 'Ortak kayıt · eşitlenemedi');
      if (e && e.durum !== 401) zamanla(30000);
    }).then(function () { calisiyor = false; });
  }

  // --- gösterge ve panel ---
  function ciz() {
    var d = $('ortakDugme');
    d.className = { ok: 'ok', is: 'is', uyari: 'uyari', hata: 'hata' }[ortak.durum] || '';
    d.querySelector('span').textContent = ortak.ileti;
    if ($('ortakPanel').style.display === 'block') panelCiz();
  }
  function panelCiz() {
    var p = $('ortakPanel'), h = '';
    h += '<h2>Ortak kayıt</h2>';
    if (bag) {
      h += '<p class="bilgi">' + kacis(ortak.ileti) + '</p>';
      h += '<p>Fişler, meseleler, notlar ve öteki çalışma verisi <code>' + kacis(bag.depo) + '</code> deposunun <code>' + kacis(bag.dal) + '</code> dalında birleşir. '
        + 'Değişiklikler birkaç saniye içinde gönderilir; başka bilgisayarlardaki değişiklikler yarım dakikada bir ve sekmeye dönünce alınır. Siz yazarken sayfa yenilenmez.</p>';
      if (ortak.cakisma) h += '<p>Son eşitlemede ' + ortak.cakisma + ' alanda çakışma oldu; bu bilgisayardaki değer geçerli sayıldı.</p>';
      if (ortak.hata) h += '<p class="hata">' + kacis(ortak.hata) + '</p>';
      h += '<div class="satir"><button id="oEsitle" type="button">Şimdi eşitle</button>'
        + '<a href="https://github.com/' + kacis(bag.depo) + '/commits/' + encodeURIComponent(bag.dal) + '" target="_blank" rel="noopener"><button type="button" class="ikincil">Değişiklik geçmişi</button></a>'
        + '<button id="oOnceki" type="button" class="ikincil" hidden>Bağlanmadan önceki yerel kayıt</button>'
        + '<button id="oKaldir" type="button" class="ikincil">Bağlantıyı kaldır</button></div>';
    } else {
      h += '<p>Ortak kayıt kurulunca bu sitede yapılan değişiklikler, aynı adresten giriş yapan bütün bilgisayarlarda görünür. Kurulum yönetici tarafından bir kez yapılır:</p>'
        + '<ol><li>GitHub → Settings → Developer settings → <b>Fine-grained tokens</b> → <b>Generate new token</b>.</li>'
        + '<li><b>Repository access:</b> Only select repositories → <code>buhari-serh-tenkit-repo</code> ve <code>buhari-serh-tenkit-site</code>.</li>'
        + '<li><b>Permissions → Repository permissions → Contents:</b> Read and write. Süreyi (Expiration) seçip oluşturun.</li>'
        + '<li>Anahtarı aşağıya yapıştırıp <b>Bağlan</b>’a basın. Anahtar şifrelenip yayına konur; giriş yapan her bilgisayar kendiliğinden bağlanır.</li></ol>'
        + '<p><b>İlk bağlantıda bu tarayıcıdaki veri ortak kaydın başlangıcı olur.</b> Güncel çalışmanız başka bir yerdeyse önce sitedeki <i>Yedek yükle</i> ile buraya alın.</p>'
        + '<label for="oToken">Erişim anahtarı</label><input id="oToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">'
        + '<div class="satir"><button id="oBaglan" type="button">Bağlan</button></div><p id="oIleti"></p>';
    }
    p.innerHTML = h;
    if (bag) {
      $('oEsitle').onclick = function () { esitle(); };
      $('oKaldir').onclick = baglantiKaldir;
      ortakAl('onceki').then(function (o) {
        var b = $('oOnceki'); if (!o || !b) return;
        b.hidden = false; b.textContent = 'Bağlanmadan önceki yerel kayıt (' + new Date(o.at).toLocaleDateString('tr-TR') + ')';
        b.onclick = function () {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([o.text], { type: 'application/json' }));
          a.download = 'buhari-tenkit-baglanti-oncesi-' + o.at.slice(0, 10) + '.json'; a.click();
        };
      });
    } else {
      $('oBaglan').onclick = baglan;
    }
  }
  function panelAcKapa(ac) {
    var p = $('ortakPanel'); ac = ac === undefined ? p.style.display !== 'block' : ac;
    p.style.display = ac ? 'block' : 'none'; $('ortakDugme').setAttribute('aria-expanded', String(ac));
    if (ac) panelCiz();
  }
  $('ortakDugme').onclick = function () { panelAcKapa(); };

  function utf8b64(t) { return b64Yap(enc.encode(t)); }

  // Mühürlü bağlantı ayarı yayın deposundaki kasa.json'a yazılır (anahtarın yayın deposuna da yazma izni olmalı).
  function kasayaYaz(muhur) {
    var y = new O.Depo({ token: bag.token, sahip: bag.yayin.split('/')[0], ad: bag.yayin.split('/')[1] });
    return y.istek('GET', '/contents/kasa.json?ref=main').then(function (f) {
      var k = JSON.parse(dec.decode(b64(f.content.replace(/\s+/g, ''))));
      if (muhur) k.ortak = muhur; else delete k.ortak;
      return y.istek('PUT', '/contents/kasa.json', { message: 'Ortak kayıt bağlantısı ' + (muhur ? 'güncellendi' : 'kaldırıldı'), content: utf8b64(JSON.stringify(k, null, 1) + '\n'), sha: f.sha, branch: 'main' })
        .then(function () { kasa.ortak = muhur; if (!muhur) delete kasa.ortak; });
    });
  }

  function baglan() {
    var token = $('oToken').value.trim(), ileti = $('oIleti'), dugme = $('oBaglan');
    if (!token) return;
    dugme.disabled = true; ileti.className = ''; ileti.textContent = 'Anahtar sınanıyor…';
    var aday = Object.assign({}, VARSAYILAN, { token: token });
    var d = new O.Depo({ token: token, sahip: aday.depo.split('/')[0], ad: aday.depo.split('/')[1], dal: aday.dal });
    d.istek('GET', '').then(function () { return d.oku(null).catch(function (e) { if (e.durum === 404) return null; throw e; }); }).then(function () {
      return muhurle(aday, 'bst-ortak');
    }).then(function (muhur) {
      try { localStorage.setItem(YEREL_BAG, muhur); } catch (e) {}
      bagKur(aday);
      ileti.textContent = 'Bağlantı yayına yazılıyor…';
      return kasayaYaz(muhur).then(function () { return ''; }, function (e) {
        return 'Bağlantı yalnız bu tarayıcıya kaydedildi; yayına yazılamadı (' + e.message + '). Anahtarın buhari-serh-tenkit-site deposuna da yazma izni olmalı.';
      });
    }).then(function (uyari) {
      panelCiz();
      if (uyari) { var p = document.createElement('p'); p.className = 'hata'; p.textContent = uyari; $('ortakPanel').appendChild(p); }
      return esitle();
    }).catch(function (e) {
      dugme.disabled = false; ileti.className = 'hata';
      ileti.textContent = e && e.durum === 401 ? 'Anahtar geçersiz.' : e && e.durum === 404 ? 'Depoya erişilemedi: anahtarın buhari-serh-tenkit-repo deposuna erişimi olmalı.' : 'Bağlanılamadı: ' + (e && e.message || e);
    });
  }

  function baglantiKaldir() {
    if (!confirm('Ortak kayıt bağlantısı kaldırılsın mı?\n\nBu tarayıcıdaki veri yerinde kalır. Bağlantı yayından da kaldırılır; öteki bilgisayarlar bir sonraki girişte eşitlemeyi durdurur.')) return;
    var b = bag;
    kasayaYaz(null).catch(function () {}).then(function () {
      try { localStorage.removeItem(YEREL_BAG); } catch (e) {}
      return ortakKoy('taban', undefined);
    }).then(function () { bagKur(null); panelCiz(); });
    return b;
  }

  function siteOlaylari() {
    var w = $('site').contentWindow;
    try {
      ['keydown', 'input', 'pointerdown', 'wheel'].forEach(function (t) { w.document.addEventListener(t, function () { sonEtkinlik = Date.now(); }, true); });
    } catch (e) {}
  }
  // Site ana kaydı yazınca (localStorage) üst pencereye storage olayı gelir.
  addEventListener('storage', function (e) { if (e.key === KEY && bag) zamanla(3000); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && bag) zamanla(500); });
  setInterval(function () { if (bag && !document.hidden) esitle(); }, 30000);

  function siteAc() {
    durum('Site açılıyor…');
    var siteMetni = dosyaAc('site');
    var hazirlik = bagYukle().then(function (b) {
      if (!b) return;
      durum('Ortak kayıt eşitleniyor…');
      return Promise.race([esitle(true), new Promise(function (r) { setTimeout(r, 20000); })]);
    });
    return Promise.all([siteMetni, hazirlik]).then(function (x) {
      var url = URL.createObjectURL(new Blob([x[0]], { type: 'text/html;charset=utf-8' }));
      var f = $('site');
      f.addEventListener('load', function () {
        siteOlaylari();
        try { if (f.contentDocument && f.contentDocument.title) document.title = f.contentDocument.title; } catch (e) {}
      });
      f.src = url;
      f.style.display = 'block';
      $('giris').style.display = 'none';
      $('ortakDugme').style.display = 'flex';
      ciz();
    });
  }

  function hata(e) {
    $('gir').disabled = false;
    if (e && e.message === 'giris') durum('Kullanıcı adı veya şifre yanlış.', true);
    else durum('Açılamadı: ' + (e && e.message || e), true);
  }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('gir').disabled = true;
    durum('Şifre doğrulanıyor…');
    kasaGetir().then(function () {
      return yuvaAc($('kullanici').value, $('sifre').value);
    }).then(function (ham) {
      // Oturum anahtarı yalnız bu sekme açıkken saklanır; sekme kapanınca silinir.
      try { sessionStorage.setItem(OTURUM, b64Yap(new Uint8Array(ham))); sessionStorage.setItem(OTURUM_AD, kullanici); } catch (e) {}
      $('sifre').value = '';
      return anahtarKur(ham);
    }).then(siteAc).catch(hata);
  });

  // Aynı sekmede yeniden yüklemede şifre tekrar sorulmaz.
  var kayit = null;
  try { kayit = sessionStorage.getItem(OTURUM); kullanici = sessionStorage.getItem(OTURUM_AD) || kullanici; } catch (e) {}
  if (kayit) {
    $('gir').disabled = true;
    durum('Oturum açılıyor…');
    kasaGetir().then(function () { return anahtarKur(b64(kayit)); }).then(siteAc).catch(function () {
      try { sessionStorage.removeItem(OTURUM); } catch (x) {}
      $('gir').disabled = false; durum('');
    });
  }
})();
</script>
